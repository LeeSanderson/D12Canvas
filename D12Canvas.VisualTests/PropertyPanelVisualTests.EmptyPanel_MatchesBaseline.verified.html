<!--!--><style>
    .diagram-container {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: minmax(400px, auto) minmax(400px, 100%);
        position: relative;
        overflow: hidden;
        border: 1px solid #ccc;
    }
    
    .diagram-canvas {
        width: 100%;
        height: 100%;
        grid-row: 1;
        position: relative;
        cursor: grab;
    }
    
    .diagram-canvas:active {
        cursor: grabbing;
    }

    .drag-over-affordance {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 0 3px #4a90d9;
        background-color: rgba(74, 144, 217, 0.08);
        pointer-events: none;
    }

    .marquee-select {
        position: absolute;
        border: 1px dashed #2f80ed;
        background-color: rgba(47, 128, 237, 0.08);
        pointer-events: none;
    }

    .selection-bounding-box {
        position: absolute;
        border: 1px solid #2f80ed;
        pointer-events: none;
        z-index: 1000;
    }

    .group-tab-stop {
        position: absolute;
        pointer-events: none;
    }

    .group-tab-stop:focus {
        outline: none;
    }

    .group-resize-handle {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #2f80ed;
        border-radius: 50%;
        pointer-events: auto;
    }

    .group-resize-handle.top-left {
        top: -5px;
        left: -5px;
        cursor: nwse-resize;
    }

    .group-resize-handle.top {
        top: -5px;
        left: calc(50% - 5px);
        cursor: ns-resize;
    }

    .group-resize-handle.top-right {
        top: -5px;
        right: -5px;
        cursor: nesw-resize;
    }

    .group-resize-handle.right {
        top: calc(50% - 5px);
        right: -5px;
        cursor: ew-resize;
    }

    .group-resize-handle.bottom-right {
        bottom: -5px;
        right: -5px;
        cursor: nwse-resize;
    }

    .group-resize-handle.bottom {
        bottom: -5px;
        left: calc(50% - 5px);
        cursor: ns-resize;
    }

    .group-resize-handle.bottom-left {
        bottom: -5px;
        left: -5px;
        cursor: nesw-resize;
    }

    .group-resize-handle.left {
        top: calc(50% - 5px);
        left: -5px;
        cursor: ew-resize;
    }

    .edges-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .edge-line {
        fill: none;
        stroke: #4a4a4a;
        stroke-width: 2;
        pointer-events: auto;
        cursor: pointer;
    }

    .edge-line.selected {
        stroke: #2f80ed;
        stroke-width: 3;
    }

    .edge-arrowhead {
        fill: #4a4a4a;
    }

    .edge-arrowhead.selected {
        fill: #2f80ed;
    }

    .edge-label {
        position: absolute;
        cursor: default;
    }

    .connector-drag-preview {
        stroke: #2ecc71;
        stroke-width: 2;
        stroke-dasharray: 6 4;
    }

    .floating-endpoint {
        fill: #f39c12;
        stroke: #ffffff;

        pointer-events: auto;
        cursor: grab;
    }

    .canvas-content {
        position: absolute;
