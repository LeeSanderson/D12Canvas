<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D12Canvas</title>
    <base href="/" />
    <script>
        (function () {
            var media = matchMedia("(prefers-color-scheme: dark)");

            function storedChoice() {
                try {
                    var choice = localStorage.getItem("d12canvas.theme");
                    return choice === "light" || choice === "dark" ? choice : "system";
                } catch (e) {
                    return "system";
                }
            }

            function apply() {
                var choice = storedChoice();
                var mode = choice === "system" ? (media.matches ? "dark" : "light") : choice;
                document.documentElement.setAttribute("data-bs-theme", mode);
                document.documentElement.setAttribute("data-d12-theme", mode);
            }

            apply();
            media.addEventListener("change", function () {
                if (storedChoice() === "system") {
                    apply();
                }
            });
        })();
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <svg class="app-loading-mark" viewBox="0 0 16 16" width="64" height="64" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M8 0.23L12.57 1.71L15.39 5.6L15.39 10.4L12.57 14.29L8 15.77L3.43 14.29L0.61 10.4L0.61 5.6L3.43 1.71ZM8 1.07L12.07 2.39L14.59 5.86L14.59 10.14L12.07 13.61L8 14.93L3.93 13.61L1.41 10.14L1.41 5.86L3.93 2.39Z" />
                <path fill-rule="evenodd" d="M8 3.31L12.46 6.55L10.76 11.8L5.24 11.8L3.54 6.55ZM8 4.29L11.52 6.85L10.18 11L5.82 11L4.48 6.85Z" />
                <path d="M8.4 3.8L8.4 0.65L7.6 0.65L7.6 3.8ZM12.12 7.08L15.11 6.11L14.87 5.35L11.87 6.32ZM10.15 11.63L12 14.18L12.64 13.71L10.79 11.16ZM5.21 11.16L3.36 13.71L4 14.18L5.85 11.63ZM4.13 6.32L1.13 5.35L0.89 6.11L3.88 7.08Z" />
                <path d="M7.37 6.4L7.37 9.9L6.54 9.9L6.54 7.47L5.81 7.91L5.81 7.08L6.69 6.4ZM8.02 7.52A1.09 1.09 0 1 1 10.07 8.06L9.19 9.17L10.19 9.17L10.19 9.9L8.05 9.9L8.05 9.44L9.43 7.7A0.36 0.36 0 1 0 8.75 7.52Z" />
            </svg>
            <div class="progress app-loading-progress" role="progressbar" aria-label="Loading D12Canvas">
                <div class="progress-bar"></div>
            </div>
            <p class="text-body-secondary small mb-0">Loading D12Canvas…</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="alert alert-danger" role="alert">
        <div class="d-flex align-items-center gap-2">
            <svg class="flex-shrink-0" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2" />
            </svg>
            <span class="me-auto">Something went wrong. Unsaved changes may be lost.</span>
            <a href="." class="reload btn btn-sm btn-danger" onclick="location.reload(); return false;">Reload</a>
            <button type="button" class="btn-close dismiss" aria-label="Dismiss"></button>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
