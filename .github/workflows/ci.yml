name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: bUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.301"
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier --check .
      - name: Run bUnit tests
        run: dotnet test --project test/D12Canvas.Tests/D12Canvas.Tests.csproj
      - name: Run App bUnit tests
        run: dotnet test --project test/D12Canvas.App.Tests/D12Canvas.App.Tests.csproj
      - name: Run App API tests
        run: dotnet test --project test/D12Canvas.App.Api.Tests/D12Canvas.App.Api.Tests.csproj

  visual-tests:
    name: Playwright visual tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.61.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Build Playwright visual tests
        run: dotnet build test/D12Canvas.VisualTests/D12Canvas.VisualTests.csproj
      - name: Run Playwright visual tests
        run: ./test/D12Canvas.VisualTests/bin/Debug/net10.0/D12Canvas.VisualTests -parallel none
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-diffs
          path: test/D12Canvas.VisualTests/**/*.received.*
          retention-days: 7
